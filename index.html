<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puppet Fighter 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: monospace; }
  canvas { display: block; }
  .hud { position: fixed; pointer-events: none; user-select: none; }

  /* tuning line (movement debug), top left */
  #hud { left: 10px; top: 8px; color: #f1c40f; font-size: 12px; }

  /* round / timer / IT status, top centre */
  #top { left: 0; right: 0; top: 10px; text-align: center; text-shadow: 0 2px 6px #000; }
  #round { color: #9fb3c8; font-size: 12px; letter-spacing: 3px; }
  #timer { color: #fff; font-size: 38px; font-weight: bold; line-height: 1.1; }
  #timer.low { color: #ff6b5e; }
  #status { font-size: 22px; font-weight: bold; letter-spacing: 4px; margin-top: 2px; }
  #status.it { color: #ff4d4d; }
  #status.run { color: #5ee6ff; }

  /* live IT-time leaderboard, top right */
  #board { right: 12px; top: 10px; min-width: 210px; padding: 8px 10px; background: rgba(6, 10, 20, 0.62); border-radius: 6px; color: #dfe8f5; font-size: 12px; }
  #board .head { color: #9fb3c8; font-size: 10px; letter-spacing: 2px; margin-bottom: 4px; }
  #board .row { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  #board .row.me { color: #fff; font-weight: bold; }
  #board .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  #board .nm { flex: 1; }
  #board .tm { width: 52px; text-align: right; }
  #board .st { width: 34px; text-align: right; color: #f1c40f; }
  #board .itb { width: 16px; text-align: center; color: #ff4d4d; }

  /* countdown / GO / round + match winner banner, screen centre */
  #banner { left: 0; right: 0; top: 30%; text-align: center; text-shadow: 0 3px 10px #000; display: none; }
  #bannerMain { color: #fff; font-size: 64px; font-weight: bold; }
  #bannerSub { color: #cfe0f5; font-size: 18px; margin-top: 8px; }
  #banner.win #bannerMain { font-size: 44px; color: #f1c40f; }

  /* small event line (tags, shoves, falls) */
  #toast { left: 0; right: 0; top: 112px; text-align: center; color: #ffd9a8; font-size: 14px; text-shadow: 0 2px 6px #000; }

  #hint b { font-weight: normal; color: #5c6b7d; }
  #hint b.on { color: #f1c40f; font-weight: bold; }
  #hint { left: 0; right: 0; bottom: 12px; text-align: center; color: #9fb3c8; font-size: 12px; }
</style>
</head>
<body>
<div id="hud" class="hud"></div>
<div id="top" class="hud">
  <div id="round"></div>
  <div id="timer"></div>
  <div id="status"></div>
</div>
<div id="board" class="hud"></div>
<div id="banner" class="hud"><div id="bannerMain"></div><div id="bannerSub"></div></div>
<div id="toast" class="hud"></div>
<div id="hint" class="hud">Click to capture mouse &nbsp;|&nbsp; WASD move &nbsp;|&nbsp; Space jump &nbsp;|&nbsp; Shift slide (hold) &nbsp;|&nbsp; F dash &nbsp;|&nbsp; mouse orbit camera &nbsp;|&nbsp; R stuck (a fall in TAG, instant respawn in SANDBOX) &nbsp;|&nbsp; [G] Mode: <b id="modeTag" class="on">TAG</b> / <b id="modeSandbox">SANDBOX</b> &nbsp;|&nbsp; Esc release mouse</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
